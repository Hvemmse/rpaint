[package]
name = "rpaint"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

[profile.release]
opt-level = 3
lto = true
strip = true